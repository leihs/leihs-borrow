query getDelegation($id: UUID!) {
  delegation(id: $id) {
    id
    name
    inventoryPools(orderBy: [{ attribute: NAME, direction: ASC }]) {
      id
      name
      maximumReservationDuration
      hasReservableItems
      defaultPickupLocationName
      pickupLocations {
        id
        name
        description
      }
    }
    suspensions {
      inventoryPool {
        id
      }
    }
  }
}
